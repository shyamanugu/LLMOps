[project]
name = "llmops-platform"
version = "0.1.0"
description = "Reusable enterprise LLMOps platform (framework) for running LLM applications on Azure."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary — internal" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "openai>=1.40",                       # Azure OpenAI via the openai SDK
  "azure-identity>=1.17",               # Managed Identity / DefaultAzureCredential
  "azure-search-documents>=11.5",       # Azure AI Search (RAG)
  "azure-ai-contentsafety>=1.0",        # guardrails
  "azure-ai-documentintelligence>=1.0", # document extraction
  "azure-cosmos>=4.7",                  # state / feedback
  "azure-monitor-opentelemetry>=1.6",   # App Insights exporter
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "langfuse>=2.50",                     # LLM observability + prompt registry (self-hosted)
  "presidio-analyzer>=2.2",             # PII detection (open source)
  "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
eval = [
  "ragas>=0.2",
  "deepeval>=1.0",
  "pandas>=2.2",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.4",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 110

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires live Azure/Langfuse services"]
testpaths = ["tests"]
