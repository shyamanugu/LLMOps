# PR checks — the merge gate.
#
# Runs on pull requests that touch behaviour-bearing paths (prompts, agents,
# backend source, evals). Static checks + unit tests must pass, and then the
# EVALUATION GATE runs on the changed use cases and blocks merge if quality
# regresses below baseline. Auth to Azure is via OIDC (federated credentials),
# so NO long-lived secrets are stored.
#
# Branch protection should mark the "gate" job as a required status check.

name: pr-checks

on:
  pull_request:
    branches: [main]
    paths:
      - "usecases/**/prompts/**"
      - "usecases/**/agents/**"
      - "backend/src/**"
      - "backend/evals/**"
      - "platform/**"
      - "backend/pyproject.toml"
      - ".github/workflows/pr-checks.yml"

# Least privilege. id-token:write is required for azure/login OIDC.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # --------------------------------------------------------------- lint + type
  static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (dev + eval extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Ruff (lint + import order)
        run: ruff check .
      - name: Black (format check)
        run: black --check .
      - name: Mypy (strict types)
        run: mypy src

  # ------------------------------------------------------------------ unit test
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Pytest (unit; integration skipped)
        run: pytest -m "not integration" --cov=llmops --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------ EVALUATION GATE (blocks merge)
  gate:
    needs: [static-checks, unit-tests]
    runs-on: ubuntu-latest
    # GitHub Environment can hold the eval subscription vars; no reviewers here
    # (this is a gate, not a deployment).
    environment: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so the runner can diff changed files vs the base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      # OIDC login — federated, no client secret. The eval harness calls Azure
      # OpenAI (judge model) via the resulting Managed Identity / workload token.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}        # TODO(env): set as Actions variable per environment
          tenant-id: ${{ vars.AZURE_TENANT_ID }}         # TODO(env)
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # TODO(env)

      - name: Run evaluation gate on changed use cases
        env:
          LLMOPS_ENVIRONMENT: dev
          # Endpoints resolved from environment variables; auth via the OIDC token.
          LLMOPS_AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}  # TODO(env)
        run: |
          # The EVALUATION GATE. Non-zero exit blocks the PR: scores must clear
          # absolute floors AND stay within the baseline-regression budget.
          python evals/run.py --subset changed --fail-under baseline

      - name: Publish gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report
          path: backend/evals/reports/**
          if-no-files-found: ignore
