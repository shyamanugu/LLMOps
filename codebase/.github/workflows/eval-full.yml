# Full evaluation — the complete golden set.
#
# Runs on every merge to main (post-merge quality signal + refreshes the
# baseline scores that PR checks regress against) and nightly on a schedule
# (catches drift from changing models/data even with no code change). Posts a
# summary to the run and can be extended to notify a channel.

name: eval-full

on:
  push:
    branches: [main]
    paths:
      - "usecases/**"
      - "backend/src/**"
      - "backend/evals/**"
      - "platform/**"
  schedule:
    # Nightly at 02:00 UTC. Adjust to your team's timezone/quiet hours.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: eval-full-${{ github.ref }}
  cancel-in-progress: false   # let a full run finish; don't cancel baseline updates

env:
  PYTHON_VERSION: "3.11"

jobs:
  golden:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}          # TODO(env)
          tenant-id: ${{ vars.AZURE_TENANT_ID }}           # TODO(env)
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # TODO(env)

      - name: Run full golden evaluation
        id: eval
        env:
          LLMOPS_ENVIRONMENT: dev
          LLMOPS_AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}  # TODO(env)
        run: |
          # Full run over the entire golden set. On main this refreshes the
          # baseline the PR gate compares against; on schedule it flags drift.
          # --report writes a markdown summary consumed in the next step.
          python evals/run.py --subset full --fail-under absolute \
            --report evals/reports/summary.md

      - name: Post summary to run
        if: always()
        run: |
          if [ -f evals/reports/summary.md ]; then
            {
              echo "## Full evaluation summary"
              cat evals/reports/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced (see logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full report + baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-report
          path: backend/evals/reports/**
          if-no-files-found: ignore

      # TODO(notify): post summary.md to Slack/Teams on failure, e.g. via a
      # webhook stored as an Actions secret. Kept out to avoid secret coupling.
