# RAG index refresh — scheduled re-indexing of the knowledge base.
#
# Re-ingests source content into Azure AI Search so RAG answers stay current.
# Runs on a schedule and on demand. Uses OIDC + Managed Identity; the indexer
# reads from the configured data source (Storage/Blob) and writes to the search
# index. No secrets are stored — access is granted via role assignments.

name: index-refresh

on:
  schedule:
    # Every 6 hours. Tune to how often source content changes.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      usecase:
        description: "Use case to re-index (blank = all)"
        required: false
        default: ""
      full_rebuild:
        description: "Reset the index and rebuild from scratch"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # One refresh at a time to avoid competing indexer runs.
  group: index-refresh-${{ github.event.inputs.usecase || 'all' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  reindex:
    runs-on: ubuntu-latest
    environment: prod            # index the production knowledge base
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}     # TODO(env)
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}  # TODO(env)

      - name: Run RAG re-index
        env:
          LLMOPS_ENVIRONMENT: prod
          LLMOPS_AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}      # TODO(env)
          LLMOPS_AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}      # TODO(env)
          USECASE: ${{ github.event.inputs.usecase }}
          FULL_REBUILD: ${{ github.event.inputs.full_rebuild }}
        run: |
          set -euo pipefail
          ARGS=""
          [ -n "${USECASE}" ] && ARGS="$ARGS --usecase ${USECASE}"
          [ "${FULL_REBUILD}" = "true" ] && ARGS="$ARGS --rebuild"
          # Re-index entrypoint (embeds + upserts chunks into Azure AI Search).
          # TODO(wiring): implement backend/pipelines_cli.py `reindex` subcommand.
          python pipelines_cli.py reindex $ARGS

      - name: Refresh summary
        if: always()
        run: echo "Index refresh finished for '${USECASE:-all}' (rebuild=${FULL_REBUILD:-false})." >> "$GITHUB_STEP_SUMMARY"
