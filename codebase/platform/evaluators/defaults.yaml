# Default evaluator set + thresholds (config-as-code).
#
# The evaluation gate (backend/src/llmops/evaluation/gate.py) loads this file to
# decide whether a change may merge/deploy. A use case may override or extend a
# metric in its own usecases/<uc>/evals/evaluators.yaml, but these defaults apply
# unless overridden. Thresholds are enforced in CI by:
#   python backend/evals/run.py --subset changed --fail-under baseline
#
# Two kinds of check:
#   * absolute floor  — a metric must be >= (or <= for "max") its threshold.
#   * baseline regression — a metric may not drop more than `regression.max_drop`
#     below the last known-good (baseline) score recorded on main.

version: 1

# ---------------------------------------------------------------------------
# Metrics: name -> implementation + threshold. `direction` says which side of
# the threshold passes. `weight` is advisory for reporting/aggregation.
# ---------------------------------------------------------------------------
metrics:
  groundedness:
    impl: llmops.evaluation.metrics.ragas.GroundednessMetric
    direction: min          # score must be >= threshold
    threshold: 0.90         # answers must be supported by retrieved context
    weight: 1.0
    description: "Fraction of answer claims supported by retrieved context (RAG faithfulness)."

  tool_selection:
    impl: llmops.evaluation.metrics.tool_selection.ToolSelectionMetric
    direction: min          # score must be >= threshold
    threshold: 0.95         # the agent must pick the correct tool almost always
    weight: 1.0
    description: "Agent chose the expected tool for the case (scored from the trace)."

  pii_leak:
    impl: llmops.evaluation.metrics.deepeval.PiiLeakMetric
    direction: max          # score must be <= threshold
    threshold: 0            # zero tolerance: no PII may appear in output
    weight: 1.0
    description: "Count of PII entities leaked into the model output. Must be zero."

# ---------------------------------------------------------------------------
# Baseline-regression guard: applies to every metric above. A change fails the
# gate if any metric regresses more than `max_drop` vs the baseline on main,
# even when it still clears its absolute floor. Catches slow quality erosion.
# ---------------------------------------------------------------------------
regression:
  enabled: true
  max_drop: 0.02            # allow at most a 2% absolute drop from baseline
  baseline_ref: main        # baseline scores are the last green run on this ref

# ---------------------------------------------------------------------------
# Gate behaviour.
# ---------------------------------------------------------------------------
gate:
  fail_under: baseline      # "baseline" = floors + regression; "absolute" = floors only
  subset_on_pr: true        # PRs score only changed use cases (fast feedback)
  full_on_main: true        # merges to main run the complete golden set
  judge_model_alias: judge  # LLM-as-judge uses this alias from platform/models.yaml
