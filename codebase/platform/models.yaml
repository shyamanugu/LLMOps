# Model catalog — task alias -> Azure OpenAI deployment name, per environment.
#
# This is the ONLY place a task maps to a model. Application code asks for an alias
# (e.g. resolve("reason")); it never hard-codes "gpt-5.2". Swapping a model is a reviewed
# pull request to this file that must pass the evaluation gate before it can deploy.
#
# The values on the right are DEPLOYMENT NAMES you create in Azure OpenAI (they can match
# the model name or be custom). Update them to match your deployments — see todo.html.

environments:
  prod:
    aliases:
      reason: gpt-5.2                 # complex, multi-step reasoning
      bulk: gpt-5-mini               # high-volume, simpler steps
      judge: gpt-5-mini              # LLM-as-judge for evaluation (small = cheap)
      voice: gpt-realtime-1.5        # real-time speech-to-speech
      embed: text-embedding-3-large  # embeddings for RAG

  test:
    aliases:
      reason: gpt-5-mini
      bulk: gpt-5-mini
      judge: gpt-5-mini
      voice: gpt-realtime-1.5
      embed: text-embedding-3-large

  dev:
    aliases:
      reason: gpt-5-mini
      bulk: gpt-5-mini
      judge: gpt-5-mini
      voice: gpt-realtime-1.5
      embed: text-embedding-3-large
