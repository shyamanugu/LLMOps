# Reusable tool catalog (config-as-code) — enriches the built-in tools in
# backend/src/llmops/tools/registry.py. Descriptions here are what the model sees when deciding
# which tool to call, and `mcp_server` attributes each tool to a logical MCP server for tracing.
# `data_source` names the data_access backend the tool reads; `input_schema` summarises its inputs
# (mirrors the pydantic input model). All catalog tools are read-only.
# Adding or changing a tool's contract is a reviewed pull request.

tools:
  - name: search_knowledge
    mcp_server: llmops.knowledge
    data_source: rag                     # data_access/rag.py -> Azure AI Search
    description: >-
      Search the knowledge base (RAG over Azure AI Search) for passages relevant to a query and
      return ranked, citable chunks. Use for grounded question answering.
    input_schema:
      query: { type: string, required: true, summary: "Natural-language search query." }
      k: { type: integer, required: false, default: 5, summary: "Number of chunks to return (1-20)." }
      filters: { type: object, required: false, summary: "Optional metadata filters, e.g. {source, section}." }

  - name: query_sql
    mcp_server: llmops.sql
    data_source: sql                     # data_access/sql.py -> allow-listed, read-only SQL
    description: >-
      Answer a question by generating and safely executing a read-only SQL query. Only allow-listed
      tables are queryable and writes are rejected.
    input_schema:
      question: { type: string, required: true, summary: "Natural-language question to translate to SQL." }
      max_rows: { type: integer, required: false, default: 100, summary: "Row cap for the result set." }

  - name: extract_document
    mcp_server: llmops.documents
    data_source: documents               # data_access/documents.py -> Azure AI Document Intelligence
    description: >-
      Extract structured content (text, tables, key/value pairs) from a document using Azure AI
      Document Intelligence.
    input_schema:
      file_ref: { type: string, required: true, summary: "Blob/URL/ref to the document to extract." }
      model_id: { type: string, required: false, default: "prebuilt-layout", summary: "Doc Intelligence model id." }

  - name: get_record
    mcp_server: llmops.records
    data_source: records                 # data_access/records.py -> system of record client
    description: >-
      Fetch a single record by id from a named system of record (CRM, ERP, ATS, ticketing).
    input_schema:
      system: { type: string, required: true, summary: "System of record key, e.g. 'crm' | 'ats'." }
      id: { type: string, required: true, summary: "Primary identifier of the record." }
