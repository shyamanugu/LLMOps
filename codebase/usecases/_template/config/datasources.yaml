# Data sources for this use case (PLACEHOLDER — fill in per use case).
#
# Declares where this use case's data comes from. The data-access layer
# (backend/src/llmops/data_access) reads this to wire RagRetriever, SqlDataSource,
# DocumentExtractor, and RecordClient. Structured data uses the SQL tool (read-only,
# parameterised, allow-listed) — it does NOT go through RAG.

usecase: _template

# Unstructured text -> Retrieval-Augmented Generation over Azure AI Search.
rag:
  enabled: false
  # TODO(datasource): set the Azure AI Search index + alias for this use case.
  index: ""            # e.g. <usecase>-knowledge-v1
  alias: ""            # e.g. <usecase>-knowledge  (atomic switch on refresh)
  embed_alias: embed   # model alias used to embed queries/chunks
  top_k: 5

# Structured data -> read-only NL2SQL via the query_sql tool.
sql:
  enabled: false
  # TODO(datasource): connection is resolved via Managed Identity, not a connection string.
  allow_listed_tables: []   # e.g. [dim_agent, fact_calls]  — ONLY these tables are queryable
  read_only: true

# Documents / files -> Azure AI Document Intelligence extraction.
documents:
  enabled: false
  # TODO(datasource): source container / path for files (PDF, scans, forms, images).
  source: ""

# Systems of record -> get_record tool (via MCP).
records:
  enabled: false
  systems: []   # e.g. [crm, ats]  — each wired as a get_record source
