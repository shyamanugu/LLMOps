# APIX pipeline (PLACEHOLDER steps — prompt_ids resolve once prompts are generated).
#
# Sequential pipeline (not agent-to-agent):
#   transcript -> dimension agents -> extraction -> scoring -> coaching report
# Loaded by backend/src/llmops/orchestration/pipeline.py. Each step records an agent span;
# each model call records tokens + cost. Dimension agents run one pass per coaching
# dimension over the same transcript.

name: apix.coaching_pipeline
description: Turn a contact-center call transcript into an evidence-cited coaching report.

inputs: [transcript_id, program]

steps:
  # 1) Intake — load + normalise + PII-scrub the transcript for the program.
  - id: intake
    agent: transcript_intake
    prompt_id: apix.transcript_intake      # TODO(prompt): generate this prompt
    model_alias: bulk
    tools: [get_record]                    # fetch call metadata
    outputs: [clean_transcript, call_meta]

  # 2) Dimension agents — one analysis pass per coaching dimension.
  #    TODO(pipeline): expand to one step per dimension your program scores
  #    (opening, discovery, objection_handling, upsell, compliance, closing).
  - id: dimension_sales
    agent: dimension_agent
    prompt_id: apix.dimension_sales        # TODO(prompt): generate (see canonical example)
    model_alias: reason
    tools: [search_knowledge]              # retrieve the program rubric
    outputs: [dimension_findings.sales]

  - id: dimension_compliance
    agent: dimension_agent
    prompt_id: apix.dimension_compliance   # TODO(prompt): generate
    model_alias: reason
    tools: [search_knowledge]
    outputs: [dimension_findings.compliance]

  # 3) Evidence extraction — pull exact transcript quotes supporting each finding.
  - id: extraction
    agent: evidence_extractor
    prompt_id: apix.evidence_extraction    # TODO(prompt): generate
    model_alias: bulk
    tools: []
    outputs: [evidence]

  # 4) Scoring — score each dimension + overall band, grounded ONLY in evidence.
  - id: scoring
    agent: scorer
    prompt_id: apix.scoring                # TODO(prompt): generate
    model_alias: reason
    tools: []
    outputs: [dimension_scores, overall_band, flags]

  # 5) Coaching report — write the note; MUST cite evidence; MUST NOT invent moments.
  - id: coaching_report
    agent: coach
    prompt_id: apix.coaching_report        # canonical example prompt (v3)
    model_alias: reason
    tools: []
    outputs: [coaching_report]

guardrails:
  input: [content_safety, pii, injection]   # transcripts carry personal data
  output: [pii, schema_validation, content_safety]
