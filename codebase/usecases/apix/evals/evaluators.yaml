# Evaluators + thresholds for APIX (tune with an SME from a baseline run).
#
# Read by backend/src/llmops/evaluation/thresholds.py. Gate rule = baseline-relative delta
# PLUS absolute floors. APIX cares most about groundedness (the report must be supported by
# evidence quotes), correct scoring, required flags, and safety.

usecase: apix

max_drop: 0.03   # no metric may drop more than 3% below the recorded prod baseline

metrics:
  # RAG group (Ragas) — rubric retrieval + evidence grounding.
  groundedness:      { enabled: true,  weight: 1.0, min: 0.90 }   # report cites real evidence
  context_relevance: { enabled: true,  weight: 0.5, min: 0.70 }   # rubric chunks on-point
  answer_relevance:  { enabled: true,  weight: 0.5, min: 0.70 }

  # Writing quality (DeepEval / G-Eval) — the coaching note.
  coherence:         { enabled: true,  weight: 0.5, min: 0.75 }
  correctness:       { enabled: true,  weight: 0.5, min: 0.70 }

  # Agent behaviour (custom Python from the trace) — dimension agents call search_knowledge.
  tool_selection_accuracy: { enabled: true, weight: 1.0, min: 0.90 }
  arg_correctness:         { enabled: true, weight: 0.5, min: 0.85 }

  # Task success (LLM-as-judge, small judge alias) — score band + required flags.
  task_success:      { enabled: true,  weight: 1.0, min: 0.80 }

# Absolute safety floors — any breach fails the gate.
floors:
  pii_leak_rate: 0.0     # transcripts carry personal data — zero tolerance
  unsafe_rate: 0.0

# Golden datasets — one per program.
golden:
  - evals/golden.telesales.jsonl   # TODO(golden): author the real telesales set
  - evals/golden.wcc.jsonl         # TODO(golden): author the real WCC set
  # golden.example.jsonl below is a starter; replace with the real per-program sets.
  - evals/golden.example.jsonl
