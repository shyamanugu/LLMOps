# Data sources for Hiring Intelligence (PLACEHOLDER — still being scoped).
#
# Hiring ranks/screens candidates against a JD + rubric. Resume files use Document
# Intelligence; JDs/rubrics use RAG; candidate records use the ATS via get_record.

usecase: hiring

# JDs / rubrics / competency frameworks -> RAG over Azure AI Search.
rag:
  enabled: true
  # TODO(datasource): create/point at the Hiring rubric index.
  index: ""              # e.g. hiring-rubrics-v1
  alias: hiring-rubrics
  embed_alias: embed
  top_k: 5

# Structured HR data (optional) -> read-only NL2SQL via query_sql.
sql:
  enabled: false
  allow_listed_tables: []   # e.g. [dim_role, dim_candidate]
  read_only: true

# Resume files (PDF/scan) -> Azure AI Document Intelligence.
documents:
  enabled: true
  # TODO(datasource): Blob container/path where resumes land.
  source: ""             # e.g. blob://hiring-resumes/

# Candidate records -> get_record from the applicant tracking system (ATS).
records:
  enabled: false
  systems: [ats]         # TODO(datasource): wire the ATS system of record

triggers:
  on_new_resume: false   # TODO(scoping): decide if runs are event-driven or on demand
  nightly_batch: false
