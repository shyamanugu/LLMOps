# Hiring Intelligence pipeline (PLACEHOLDER — lighter; still being scoped).
#
# Sequential pipeline (not agent-to-agent):
#   intake -> resume rank -> screening -> summary
# Loaded by backend/src/llmops/orchestration/pipeline.py.

name: hiring.screening_pipeline
description: Rank and screen candidates against a job description + rubric.

inputs: [job_id, candidate_ids]

steps:
  # 1) Intake — extract resume text (Document Intelligence), PII-scrub, load JD + rubric.
  - id: intake
    agent: candidate_intake
    prompt_id: hiring.intake               # TODO(prompt): generate
    model_alias: bulk
    tools: [extract_document, get_record]
    outputs: [resumes_text, job_spec]

  # 2) Resume rank — score/rank each candidate vs JD + rubric, grounded in resume text.
  - id: resume_rank
    agent: ranker
    prompt_id: hiring.resume_rank          # TODO(prompt): generate
    model_alias: reason
    tools: [search_knowledge]              # retrieve rubric / competency framework
    outputs: [ranking, shortlist]

  # 3) Screening — structured notes per shortlisted candidate (strengths, gaps, questions).
  - id: screening
    agent: screener
    prompt_id: hiring.screening            # TODO(prompt): generate
    model_alias: reason
    tools: []
    outputs: [screening_notes]

  # 4) Summary — recruiter-facing shortlist summary + ranking rationale.
  - id: summary
    agent: summariser
    prompt_id: hiring.summary              # TODO(prompt): generate
    model_alias: bulk
    tools: []
    outputs: [recruiter_summary]

guardrails:
  input: [content_safety, pii, injection]   # resumes carry personal data
  output: [pii, schema_validation, content_safety]
