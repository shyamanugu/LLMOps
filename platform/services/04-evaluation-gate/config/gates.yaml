# Per-usecase, per-environment pass threshold. A usecase not listed here
# uses the platform default (100% — every golden-dataset case must pass; see
# docs/decisions/0008-evaluation-gate-scope.md for why the default is strict
# rather than a softer percentage).

usecases:
  # ── ai_pipeline (AIA call-analytics) ──────────────────────────────────────
  # Phase 0 stub thresholds. Phase 5 wires golden datasets + evaluators
  # (SchemaEvaluator for structured analysis/individual_metrics; LLMJudge for
  # denoise/summary) and a CI gate. Tighten these as coverage grows.
  ai_pipeline:
    dev:
      pass_threshold: 0.8
    test:
      pass_threshold: 0.9
    prod:
      pass_threshold: 1.0
