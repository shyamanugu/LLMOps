# Scheduled nightly evaluation. Catches quality drift in production over time.
# (The same job also ships as an Azure Function App in jobs/nightly_eval/ — either can run it;
#  this GitHub schedule is the simplest way to start.)
name: nightly-eval

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch: {}    # allow manual runs too

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Nightly evaluation
        run: python scripts/run_eval_gate.py example_qa
      # TODO(wiring): on failure, send an alert (email / Teams / open an incident).
