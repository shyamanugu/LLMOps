# Build and deploy the app to Azure — but ONLY after the evaluation gate passes.
# Shows what an LLMOps deploy pipeline covers: gate -> build -> deploy -> smoke check.
name: deploy

on:
  push:
    branches: [main]

# OIDC login to Azure — no stored cloud secrets.
permissions:
  id-token: write
  contents: read

jobs:
  # 1) Re-run the gate on main before we build anything.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Evaluation gate
        run: python scripts/run_eval_gate.py example_qa

  # 2) Only if the gate passed: build the container and deploy it.
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: prod          # a GitHub Environment with required reviewers = the promotion gate
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUB_ID }}

      - name: Build and push the image
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image llmops-app:${{ github.sha }} .

      # Option A — Azure Container App (recommended for services).
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/llmops-app:${{ github.sha }}

      # Option B — Azure App Service (uncomment to use instead of Container Apps).
      # - name: Deploy to Azure App Service
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: ${{ vars.APP_SERVICE_NAME }}
      #     images: ${{ vars.ACR_NAME }}.azurecr.io/llmops-app:${{ github.sha }}

      - name: Smoke check
        run: |
          # TODO(wiring): curl the deployed /health endpoint and fail if it is not OK.
          echo "smoke check placeholder"
