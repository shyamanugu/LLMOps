# On every pull request: run the evaluation gate. If it fails, the merge is blocked.
# This is the LLMOps difference from ordinary CI — quality is checked automatically, on data.
name: pr-eval-gate

on:
  pull_request:
    paths:
      - "framework/**"
      - "usecases/**"
      - "scripts/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the evaluation gate (blocks the PR if quality drops)
        # Runs the golden dataset through the pipeline and exits non-zero on failure.
        # Runs offline in mock mode; set Azure secrets to gate against the real model.
        run: python scripts/run_eval_gate.py example_qa
